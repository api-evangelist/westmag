aid: westmag
name: Westmag
description: Western Magnetics (Westmag) designs and manufactures brushless DC (BLDC)
  drone motors and robot actuators in South San Francisco, California. Built and scaled
  in America and NDAA-compliant from day one, Westmag is a vertically integrated motor
  company spanning design, manufacturing, and supply chain — producing high-volume
  BLDC drone motors for Group 1, 2, and 3 UAS platforms (20-100mm stators, Kv 100-3,000,
  outrunner and inrunner) and integrated actuators for humanoid and mobile robots
  (torque 1-150Nm, 24-48V, gearing 6:1-12:1). Founded by David Hansen (CEO) and Jordan
  Sanders (COO) and backed by Andreessen Horowitz, Founders Fund, Lux Capital, Menlo
  Ventures, and NFDG. This is a hardware company; it currently exposes no public developer
  API surface.
